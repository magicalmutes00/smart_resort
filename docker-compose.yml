services:
  postgres:
    image: postgres:15-alpine
    container_name: smartresort_postgres
    environment:
      POSTGRES_DB: smartresort
      POSTGRES_USER: smartresort
      POSTGRES_PASSWORD: smartresort
    ports:
      - "5432:5432"
    volumes:
      - smartresort_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartresort -d smartresort"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartresort_net

  redis:
    image: redis:7-alpine
    container_name: smartresort_redis
    ports:
      - "6379:6379"
    volumes:
      - smartresort_redisdata:/data
    networks:
      - smartresort_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartresort_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://smartresort:smartresort@postgres:5432/smartresort
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-in-production
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://192.168.1.5:5173","http://192.168.1.5:3000","https://defuse-herbs-sphinx.ngrok-free.dev"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartresort_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web-customer:
    build:
      context: ./apps/web/customer
      dockerfile: Dockerfile
    container_name: smartresort_web_customer
    working_dir: /app
    volumes:
      - ./apps/web/customer/src:/app/src
      - ./apps/web/customer/public:/app/public
      - ./apps/web/customer/index.html:/app/index.html
      - ./apps/web/customer/vite.config.ts:/app/vite.config.ts
      - ./apps/web/customer/tsconfig.json:/app/tsconfig.json
      - ./apps/web/customer/tailwind.config.js:/app/tailwind.config.js
      - ./apps/web/customer/postcss.config.js:/app/postcss.config.js
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://192.168.1.5:8000/api/v1
    command: npm run dev -- --host 0.0.0.0
    networks:
      - smartresort_net
    depends_on:
      - backend

volumes:
  smartresort_pgdata:
  smartresort_redisdata:

networks:
  smartresort_net:
    driver: bridge
